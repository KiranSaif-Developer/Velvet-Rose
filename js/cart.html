<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Bag | The Velvet Rose</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg shadow-sm py-3 bg-white">
    <div class="container">
        <a class="navbar-brand" href="index.html" style="font-family: 'Cinzel'; color: #db7093; font-weight: bold;">The Velvet Rose</a>
        <div class="ms-auto">
            <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill">Continue Shopping</a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h2 class="text-center mb-5" style="font-family: 'Cinzel'; color: #db7093;">Your Shopping Bag</h2>
    
    <div class="row">
        <div class="col-lg-8">
            <div id="cart-items-container" class="bg-white p-4 shadow-sm rounded">
                <p class="text-center py-5">Loading your bag...</p>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="bg-white p-4 shadow-sm rounded position-sticky" style="top: 100px;">
                <h4 class="fw-bold mb-3">Order Summary</h4>
                <hr>
                <div class="d-flex justify-content-between mb-2">
                    <span>Items Count:</span>
                    <span id="total-count" class="fw-bold">0</span>
                </div>
                <div class="d-flex justify-content-between mb-4">
                    <span class="fs-5 fw-bold">Grand Total:</span>
                    <span class="fs-5 fw-bold text-danger">Rs. <span id="total-price">0</span></span>
                </div>
                <button class="btn btn-pink w-100 rounded-pill py-3 shadow-sm fw-bold" onclick="checkout()">
                    Place Order 
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    const cartContainer = document.getElementById('cart-items-container');
    const totalCountElem = document.getElementById('total-count');
    const totalPriceElem = document.getElementById('total-price');

    // 1. Cart Items dikhane wala function
    function renderCart() {
        const cart = JSON.parse(localStorage.getItem('rose_cart')) || [];
        
        if (cart.length === 0) {
            cartContainer.innerHTML = `
                <div class="text-center py-5">
                    <p class="fs-5 text-muted">Aapka bag bilkul khali hai.</p>
                    <a href="index.html" class="btn btn-outline-danger rounded-pill">Shop Now</a>
                </div>`;
            totalCountElem.innerText = '0';
            totalPriceElem.innerText = '0';
            return;
        }

        let total = 0;
        cartContainer.innerHTML = cart.map((item, index) => {
            total += parseInt(item.price);
            return `
                <div class="d-flex align-items-center border-bottom py-3">
                    <img src="${item.image}" alt="${item.name}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 12px;">
                    <div class="ms-3 flex-grow-1">
                        <h6 class="mb-0 fw-bold">${item.name}</h6>
                        <small class="badge bg-light text-dark border">${item.category}</small>
                        <p class="mb-0 text-danger fw-bold mt-2">Rs. ${item.price}</p>
                    </div>
                    <button class="btn btn-sm btn-link text-danger" onclick="removeFromCart(${index})">Remove</button>
                </div>
            `;
        }).join('');

        totalCountElem.innerText = cart.length;
        totalPriceElem.innerText = total;
    }

    // 2. Item Remove karne ka function
    window.removeFromCart = (index) => {
        let cart = JSON.parse(localStorage.getItem('rose_cart')) || [];
        cart.splice(index, 1);
        localStorage.setItem('rose_cart', JSON.stringify(cart));
        renderCart();
    };

    // 3. Checkout (Data DB mein save karne ka logic)
    window.checkout = async () => {
        const cart = JSON.parse(localStorage.getItem('rose_cart')) || [];
        
        if (cart.length === 0) {
            alert("Order dene ke liye pehle kuch select karein!");
            return;
        }

        const orderData = {
            orderDate: new Date().toLocaleString(),
            items: cart,
            totalAmount: cart.reduce((sum, item) => sum + parseInt(item.price), 0),
            status: "Success"
        };

        try {
            // JSON Server par orders endpoint par data bhej rahay hain
            const response = await fetch('http://localhost:3001/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            });

            if (response.ok) {
                alert("Mubarak ho! Aapka order 'db.json' mein save ho gaya hai.");
                localStorage.removeItem('rose_cart'); // Cart clear karein
                window.location.href = "index.html"; // Wapas home page par
            }
        } catch (error) {
            console.error("Error:", error);
            alert("Order save nahi ho saka! Check karein ke 'npm run server' terminal mein chal raha hai.");
        }
    };

    // Initial render
    renderCart();
</script>

</body>
</html>
