<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | The Velvet Rose</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .qty-btn { width: 25px; height: 25px; border-radius: 50%; border: 1px solid #db7093; background: white; color: #db7093; cursor: pointer; line-height: 1; }
        .form-label { font-weight: 600; font-size: 0.9rem; color: #555; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg shadow-sm py-3 bg-white mb-4">
    <div class="container d-flex justify-content-between">
        <a class="navbar-brand" href="index.html" style="font-family: 'Cinzel'; color: #db7093; font-weight: bold;">The Velvet Rose</a>
        <a href="index.html" class="btn btn-outline-danger btn-sm rounded-pill">Back to Shop</a>
    </div>
</nav>

<div class="container mb-5">
    <div class="row g-4">
        <div class="col-lg-7">
            <div class="bg-white p-4 shadow-sm rounded border">
                <h4 class="fw-bold mb-4" style="color: #db7093;">Delivery Details</h4>
                <form id="checkoutForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="userName" class="form-control" placeholder="John Doe" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="userEmail" class="form-control" placeholder="john@example.com" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" id="userPhone" class="form-control" placeholder="03XXXXXXXXX" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Postal Code</label>
                            <input type="text" id="userPostal" class="form-control" placeholder="54000" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Complete Address</label>
                            <textarea id="userAddress" class="form-control" rows="2" placeholder="House #, Street, City" required></textarea>
                        </div>
                        <div class="col-12 mt-4">
                            <h5 class="fw-bold mb-3" style="color: #db7093;">Payment Method</h5>
                            <div class="form-check p-3 border rounded">
                                <input class="form-check-input ms-0 me-2" type="radio" name="payment" id="cod" checked>
                                <label class="form-check-label" for="cod">
                                    Cash on Delivery (COD)
                                </label>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="bg-white p-4 shadow-sm rounded border sticky-top" style="top: 20px;">
                <h4 class="fw-bold mb-3">Order Summary</h4>
                <div id="cart-items-container" class="mb-3" style="max-height: 300px; overflow-y: auto;">
                    </div>
                <hr>
                <div class="d-flex justify-content-between mb-2">
                    <span>Total Items:</span>
                    <span id="total-count" class="fw-bold">0</span>
                </div>
                <div class="d-flex justify-content-between mb-4 fs-4">
                    <span class="fw-bold">Grand Total:</span>
                    <span class="fw-bold text-danger">Rs. <span id="total-price">0</span></span>
                </div>
                <button type="button" class="btn btn-pink w-100 rounded-pill py-3 shadow-sm fw-bold" onclick="handleCheckout()">
                    CONFIRM ORDER
                </button>
            </div>
        </div>
    </div>
</div>



<script>
    function renderCart() {
        let cart = JSON.parse(localStorage.getItem('rose_cart')) || [];
        const container = document.getElementById('cart-items-container');
        
        if (cart.length === 0) {
            container.innerHTML = '<p class="text-center py-3">Bag is empty.</p>';
            document.getElementById('total-count').innerText = '0';
            document.getElementById('total-price').innerText = '0';
            return;
        }

        let total = 0;
        let count = 0;
        container.innerHTML = cart.map((item, index) => {
            let qty = item.quantity || 1;
            total += parseInt(item.price) * qty;
            count += qty;
            return `
                <div class="d-flex align-items-center mb-3 border-bottom pb-2">
                    <img src="${item.image}" style="width: 50px; height: 50px; object-fit: cover;" class="rounded me-2">
                    <div class="flex-grow-1">
                        <h6 class="mb-0 small fw-bold">${item.name}</h6>
                        <div class="d-flex align-items-center gap-2 mt-1">
                            <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                            <span class="small">${qty}</span>
                            <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                        </div>
                    </div>
                    <span class="small fw-bold text-danger">Rs.${item.price * qty}</span>
                </div>`;
        }).join('');

        document.getElementById('total-count').innerText = count;
        document.getElementById('total-price').innerText = total;
    }

    window.updateQty = (index, change) => {
        let cart = JSON.parse(localStorage.getItem('rose_cart')) || [];
        cart[index].quantity = (cart[index].quantity || 1) + change;
        if (cart[index].quantity < 1) cart.splice(index, 1);
        localStorage.setItem('rose_cart', JSON.stringify(cart));
        renderCart();
    };

    window.handleCheckout = async function() {
        const cart = JSON.parse(localStorage.getItem('rose_cart')) || [];
        if (cart.length === 0) return alert("Please add items first!");

        // Form Validation
        const name = document.getElementById('userName').value;
        const email = document.getElementById('userEmail').value;
        const phone = document.getElementById('userPhone').value;
        const address = document.getElementById('userAddress').value;
        const postal = document.getElementById('userPostal').value;

        if (!name || !email || !phone || !address || !postal) {
            alert("Please fill all delivery details!");
            return;
        }

        const orderData = {
            customer: { name, email, phone, address, postal },
            items: cart,
            totalAmount: document.getElementById('total-price').innerText,
            paymentMethod: "Cash on Delivery",
            orderDate: new Date().toLocaleString(),
            status: "Success"
        };

        try {
            const res = await fetch('http://localhost:3001/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            });

            if (res.ok) {
                alert(`Thank you ${name}! Your order has been placed successfully.`);
                localStorage.removeItem('rose_cart');
                window.location.href = "index.html";
            }
        } catch (e) {
            alert("Connection error with JSON Server!");
        }
    };

    document.addEventListener('DOMContentLoaded', renderCart);
</script>
</body>
</html>
